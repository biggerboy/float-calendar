<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悬浮台历 - 设置</title>
  <style>
    :root {
      --primary: #e0455a;
      --primary-hover: #c9354a;
      --primary-soft: #fdeef0;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e6e8ee;
      --divider: #f0f2f5;
      --text: #1c2027;
      --text-2: #5b6472;
      --text-3: #98a0ac;
      --radius: 10px;
      --space: 16px;
      --space-sm: 12px;
      --mono: "Cascadia Mono", "Consolas", "SFMono-Regular", Menlo, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-y: auto;
      padding-top: 36px; /* 给固定标题栏留出空间 */
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #d9dde4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #c6cbd4; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ===== 标题栏 ===== */
    .title-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 36px;
      flex-shrink: 0;
      background: #17191f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-sm);
      -webkit-app-region: drag;
      cursor: default;
    }

    .title-bar .title {
      color: #f2f3f5;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .title-bar .controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .title-bar .btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #8b909b;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-bar .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .title-bar .btn.close:hover {
      background: var(--primary);
      color: #ffffff;
    }

    /* ===== 内容区 ===== */
    .content { padding: var(--space); }

    /* 所有区块共用同一层面板：1px 描边、无阴影，不再层层套卡片 */
    .info-bar,
    .calendar-section,
    .punch-section,
    .dingtalk-section,
    .settings-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space);
      margin-bottom: var(--space);
      box-shadow: none;
    }

    /* ===== 顶部信息条 ===== */
    .info-bar {
      display: flex;
      align-items: center;
      gap: var(--space);
    }

    .info-bar .clock {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.5px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .info-bar .info-text {
      flex: 1;
      min-width: 0;
    }

    .info-bar .info-text .custom-msg {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-bar .info-text .checkin-status {
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .info-bar .info-text .checkin-status .ok {
      color: var(--text);
      font-weight: 600;
    }

    .info-bar .info-text .checkin-status .wait { color: var(--text-3); }

    /* ===== 日历 ===== */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }

    .calendar-header .month-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .calendar-header .nav-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .calendar-header .nav-btn:hover {
      background: #f5f6f9;
      color: var(--text);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .calendar-grid .weekday {
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
      padding: 4px 0;
      font-weight: 600;
    }

    .calendar-grid .day {
      text-align: center;
      font-size: 13px;
      padding: 6px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
      font-variant-numeric: tabular-nums;
    }

    .calendar-grid .day:hover { background: #f2f3f6; }

    .calendar-grid .day.today {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }

    .calendar-grid .day.other-month { color: #c9cdd5; }

    .calendar-grid .day.has-event::after {
      content: "";
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      margin: 2px auto 0;
    }

    /* ===== 区块标题 ===== */
    .punch-section h3,
    .settings-section h3,
    .dingtalk-section h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text-2);
      margin-bottom: var(--space-sm);
    }

    .punch-section h3::before,
    .settings-section h3::before,
    .dingtalk-section h3::before {
      content: "";
      width: 3px;
      height: 12px;
      border-radius: 2px;
      background: var(--primary);
    }

    /* ===== 今日打卡 ===== */
    .today-records {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }

    .record-card {
      flex: 1;
      min-width: 0;
      background: #fafbfc;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: var(--space-sm);
    }

    .record-card .label {
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 4px;
    }

    .record-card .time {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .record-card .time.empty {
      color: #c9cdd5;
      font-weight: 500;
    }

    .time-input {
      width: 100%;
      border: none;
      border-radius: 4px;
      background: transparent;
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      padding: 0;
      outline: none;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .time-input::-webkit-calendar-picker-indicator {
      opacity: 0.3;
      cursor: pointer;
    }

    .time-input:focus { background: var(--primary-soft); }

    .record-card .edit-hint {
      font-size: 10px;
      color: #b3b8c2;
      margin-top: 2px;
    }

    .record-card .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .record-card .badge.manual {
      background: #eef0f4;
      color: var(--text-2);
    }

    .record-card .badge.dingtalk {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* 推算下班 + 倒计时 */
    .countdown-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px var(--space-sm);
      margin-bottom: var(--space-sm);
    }

    .countdown-bar .cd-label {
      font-size: 11px;
      color: var(--text-3);
    }

    .countdown-bar .cd-time {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .countdown-bar .cd-remain {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .countdown-bar.done {
      background: var(--primary-soft);
      border-color: #f6d7dc;
    }

    .countdown-bar.done .cd-time,
    .countdown-bar.done .cd-remain { color: var(--text); }

    /* 打卡按钮：同尺寸，实心主按钮 + 描边次按钮 */
    .punch-buttons {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }

    .punch-btn {
      flex: 1 1 0;
      height: 40px;
      padding: 0 var(--space);
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .punch-btn.on {
      background: var(--primary);
      color: #ffffff;
    }

    .punch-btn.on:hover { background: var(--primary-hover); }

    .punch-btn.off {
      background: var(--surface);
      color: var(--primary);
      border-color: #f0cdd2;
    }

    .punch-btn.off:hover { background: var(--primary-soft); }

    .punch-btn:active { transform: scale(0.99); }

    .punch-btn:disabled {
      background: #f1f2f5;
      color: #aab0ba;
      border-color: transparent;
      cursor: not-allowed;
      transform: none;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--text-3);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      margin-top: 4px;
    }

    .link-btn:hover { color: var(--primary); }

    .recent-list {
      margin-top: var(--space-sm);
      border-top: 1px solid var(--divider);
      padding-top: var(--space-sm);
    }

    .recent-list .recent-title {
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    .recent-row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
      font-size: 12px;
      padding: 5px 0;
      color: var(--text-2);
      border-bottom: 1px solid var(--divider);
    }

    .recent-row:last-child { border-bottom: none; }

    .recent-row .date {
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .recent-row .times { font-variant-numeric: tabular-nums; }

    .recent-row .times .missing { color: #c9cdd5; }

    /* ===== 钉钉同步配置 ===== */
    .dingtalk-tip {
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-3);
      margin-bottom: var(--space-sm);
    }

    .dingtalk-tip a {
      color: var(--primary);
      text-decoration: none;
    }

    .dingtalk-tip a:hover { text-decoration: underline; }

    /* 钉钉配置：可折叠（默认收起） */
    .dt-collapse { padding: 0; }

    .dt-summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px var(--space);
      cursor: pointer;
      user-select: none;
      border-radius: var(--radius);
      transition: background 0.15s ease;
    }

    .dt-summary::-webkit-details-marker { display: none; }
    .dt-summary:hover { background: #fafbfc; }
    .dt-collapse[open] .dt-summary { border-radius: 10px 10px 0 0; }

    .dt-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text-2);
    }

    .dt-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #f1f2f5;
      color: var(--text-3);
      font-weight: 500;
      white-space: nowrap;
    }

    .dt-badge.on {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .dt-badge.warn {
      background: #f1f2f5;
      color: var(--text-2);
    }

    .dt-arrow {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #b3b8c2;
      margin-top: 2px;
      transition: transform 0.18s ease;
    }

    .dt-collapse[open] .dt-arrow { transform: rotate(180deg); }

    .dt-body { padding: 0 var(--space) var(--space); }

    .sync-status {
      font-size: 12px;
      margin-top: var(--space-sm);
      padding: 10px var(--space-sm);
      border-radius: 8px;
      background: #fafbfc;
      color: var(--text-2);
    }

    .sync-status.ok { color: var(--primary); }
    .sync-status.err { color: #b42318; }

    .sync-btn {
      width: 100%;
      height: 38px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: var(--space-sm);
    }

    .sync-btn:hover { background: #f5f6f9; }

    .sync-btn:disabled {
      background: #f7f8fa;
      color: #aab0ba;
      cursor: not-allowed;
    }

    /* ===== 设置项 ===== */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }

    .setting-row:last-child { margin-bottom: 0; }

    .setting-row label {
      font-size: 13px;
      color: var(--text-2);
      flex-shrink: 0;
      width: 84px;
    }

    .setting-row input[type="text"],
    .setting-row input[type="time"],
    .setting-row input[type="password"] {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 var(--space-sm);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .setting-row input[type="text"]:focus,
    .setting-row input[type="time"]:focus,
    .setting-row input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(224, 69, 90, 0.12);
    }

    .setting-row input[type="color"] {
      width: 40px;
      height: 30px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
    }

    .setting-row input[type="range"] {
      flex: 1;
      margin-left: 0;
      accent-color: var(--primary);
    }

    .setting-row .value-label {
      width: 36px;
      font-size: 12px;
      color: var(--text-3);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .setting-row .checkbox-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .setting-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-right: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .setting-row .checkbox-label {
      font-size: 13px;
      color: var(--text-2);
    }

    .inline-range {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .inline-range input[type="time"],
    .inline-range input[type="number"] {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 var(--space-sm);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }

    .inline-range input[type="number"] { max-width: 90px; }

    .inline-range .sep {
      font-size: 12px;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .derived {
      flex: 1;
      padding: 8px var(--space-sm);
      border-radius: 8px;
      background: #fafbfc;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .save-btn {
      width: 100%;
      height: 42px;
      margin-top: var(--space);
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .save-btn:hover { background: var(--primary-hover); }
    .save-btn:active { transform: scale(0.995); }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #17191f;
      color: #ffffff;
      padding: 8px var(--space);
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  
  </style>
</head>
<body>
  <!-- 标题栏 -->
  <div class="title-bar">
    <span class="title">悬浮台历</span>
    <div class="controls">
      <button class="btn minimize" onclick="window.api.minimizeWindow()">—</button>
      <button class="btn close" onclick="window.api.closeWindow()">✕</button>
    </div>
  </div>

  <div class="content">
    <!-- 顶部信息条 -->
    <div class="info-bar">
      <div class="clock" id="bigClock">--:--</div>
      <div class="info-text">
        <div class="custom-msg" id="customMsg"></div>
        <div class="checkin-status" id="checkinStatus"></div>
      </div>
    </div>

    <!-- 日历 -->
    <div class="calendar-section">
      <div class="calendar-header">
        <button class="nav-btn" id="prevMonth">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn" id="nextMonth">›</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- 今日打卡 -->
    <div class="punch-section">
      <h3>今日打卡</h3>

      <div class="today-records">
        <div class="record-card">
          <div class="label">上班 <span id="onBadge"></span></div>
          <input type="time" class="time-input" id="onDutyInput">
          <div class="edit-hint">点击可修改</div>
        </div>
        <div class="record-card">
          <div class="label">下班 <span id="offBadge"></span></div>
          <input type="time" class="time-input" id="offDutyInput">
          <div class="edit-hint">点击可修改</div>
        </div>
      </div>

      <div class="countdown-bar" id="countdownBar">
        <span class="cd-label">按打卡推算可下班</span>
        <span class="cd-time" id="cdTarget">--:--</span>
        <span class="cd-remain" id="cdRemain"></span>
      </div>

      <div class="punch-buttons">
        <button class="punch-btn on" id="punchOnBtn">上班打卡</button>
        <button class="punch-btn off" id="punchOffBtn">下班打卡</button>
      </div>

      <button class="link-btn" id="clearBtn">清除今日记录</button>

      <div class="recent-list">
        <div class="recent-title">最近 7 天</div>
        <div id="recentList"></div>
      </div>
    </div>

    <!-- 启动与系统 -->
    <div class="dingtalk-section">
      <h3>启动与系统</h3>
      <div class="dingtalk-tip" id="autoLaunchTip">勾选后登录 Windows 时自动启动，桌面直接出现悬浮窗。</div>

      <div class="setting-row">
        <label>开机自启</label>
        <div class="checkbox-wrap">
          <input type="checkbox" id="autoLaunchInput">
          <span class="checkbox-label">登录 Windows 后自动启动</span>
        </div>
      </div>
    </div>

    <!-- 钉钉自动同步（默认折叠） -->
    <details class="dingtalk-section dt-collapse" id="dtSection">
      <summary class="dt-summary">
        <span class="dt-title">钉钉打卡自动同步</span>
        <span class="dt-badge" id="dtBadge">未配置</span>
        <span class="dt-arrow"></span>
      </summary>

      <div class="dt-body">
        <div class="dingtalk-tip">
          需企业主管理员在
          <a href="https://open.dingtalk.com/" target="_blank">钉钉开放平台</a>
          创建「企业内部应用」，申请「考勤数据读权限」后填写下方信息。
        </div>

        <div class="setting-row">
          <label>启用同步</label>
          <div class="checkbox-wrap">
            <input type="checkbox" id="dtEnabled">
            <span class="checkbox-label">开启后自动拉取钉钉打卡时间</span>
          </div>
        </div>

        <div class="setting-row">
          <label>AppKey</label>
          <input type="text" id="dtAppKey" placeholder="企业内部应用的 AppKey">
        </div>

        <div class="setting-row">
          <label>AppSecret</label>
          <input type="password" id="dtAppSecret" placeholder="应用的 AppSecret">
        </div>

        <div class="setting-row">
          <label>UserId</label>
          <input type="text" id="dtUserId" placeholder="你的钉钉 staffId / userId">
        </div>

        <div class="setting-row">
          <label>自动同步</label>
          <div class="checkbox-wrap">
            <input type="checkbox" id="dtAutoSync">
            <span class="checkbox-label">每</span>
            <input type="number" id="dtInterval" min="1" max="120" style="width:56px;height:34px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--surface);">
            <span class="checkbox-label">分钟同步一次</span>
          </div>
        </div>

        <button class="sync-btn" id="syncNowBtn">立即同步今天</button>
        <div class="sync-status" id="syncStatus" style="display:none;"></div>
      </div>
    </details>

    <!-- 设置 -->
    <div class="settings-section">
      <h3>悬浮窗设置</h3>

      <div class="setting-row">
        <label>自定义文字</label>
        <input type="text" id="customTextInput" placeholder="输入一句话..." maxlength="50">
      </div>

      <div class="setting-row">
        <label>弹性工作制</label>
        <div class="checkbox-wrap">
          <input type="checkbox" id="flexEnabled">
          <span class="checkbox-label">按弹性上下班自动推算</span>
        </div>
      </div>

      <div id="flexFields">
        <div class="setting-row">
          <label>上班弹性</label>
          <div class="inline-range">
            <input type="time" id="flexStartBegin">
            <span class="sep">—</span>
            <input type="time" id="flexStartEnd">
          </div>
        </div>

        <div class="setting-row">
          <label>工作时长</label>
          <div class="inline-range">
            <input type="number" id="flexWorkHours" step="0.5" min="1" max="16">
            <span class="sep">小时</span>
          </div>
        </div>

        <div class="setting-row">
          <label>下班弹性</label>
          <span class="derived" id="flexOffWindow">18:00 — 18:30</span>
        </div>
      </div>

      <div id="fixedFields" style="display:none;">
        <div class="setting-row">
          <label>上班时间</label>
          <input type="time" id="checkInInput">
        </div>

        <div class="setting-row">
          <label>下班时间</label>
          <input type="time" id="checkOutInput">
        </div>
      </div>

      <div class="setting-row">
        <label>背景色</label>
        <input type="color" id="bgColorInput" value="#1a1a2e">
      </div>

      <div class="setting-row">
        <label>文字颜色</label>
        <input type="color" id="textColorInput" value="#ffffff">
      </div>

      <div class="setting-row">
        <label>强调色</label>
        <input type="color" id="accentColorInput" value="#ff5d7a">
      </div>

      <div class="setting-row">
        <label>透明度</label>
        <input type="range" id="opacityInput" min="0.3" max="1" step="0.05" value="0.88">
        <span class="value-label" id="opacityValue">88%</span>
      </div>

      <div class="setting-row">
        <label>显示秒数</label>
        <div class="checkbox-wrap">
          <input type="checkbox" id="showSecondsInput">
          <span class="checkbox-label">在时间中显示秒</span>
        </div>
      </div>

      <div class="setting-row">
        <label>显示日期</label>
        <div class="checkbox-wrap">
          <input type="checkbox" id="showDateInput">
          <span class="checkbox-label">显示日期和星期</span>
        </div>
      </div>

      <button class="save-btn" id="saveBtn">保存设置</button>
    </div>
  </div>

  <div class="toast" id="toast">已保存 ✓</div>

  <script src="flex.js"></script>
  <script>
    let config = {};
    let calendarDate = new Date();
    let todayRecords = { onDuty: null, offDuty: null, source: null };

    // 初始化
    async function init() {
      config = await window.api.getConfig();
      const dt = config.dingtalk || {};

      // 填充表单
      document.getElementById('customTextInput').value = config.customText || '';
      document.getElementById('checkInInput').value = config.checkInTime || '09:00';
      document.getElementById('checkOutInput').value = config.checkOutTime || '18:00';
      document.getElementById('bgColorInput').value = config.bgColor || '#1a1a2e';
      document.getElementById('textColorInput').value = config.textColor || '#e0e0e0';
      document.getElementById('accentColorInput').value = config.accentColor || '#e94560';
      document.getElementById('opacityInput').value = config.opacity || 0.85;
      document.getElementById('opacityValue').textContent = Math.round((config.opacity || 0.85) * 100) + '%';
      document.getElementById('showSecondsInput').checked = config.showSeconds !== false;
      document.getElementById('showDateInput').checked = config.showDate !== false;

      // 弹性工作制
      const fx = Flex.cfgOf(config);
      document.getElementById('flexEnabled').checked = fx.enabled;
      document.getElementById('flexStartBegin').value = fx.startBegin;
      document.getElementById('flexStartEnd').value = fx.startEnd;
      document.getElementById('flexWorkHours').value = (fx.workMinutes / 60).toFixed(1).replace(/\.0$/, '');
      toggleFlexFields();
      updateFlexOffWindow();

      // 钉钉配置
      document.getElementById('dtEnabled').checked = !!dt.enabled;
      document.getElementById('dtAppKey').value = dt.appKey || '';
      document.getElementById('dtAppSecret').value = dt.appSecret || '';
      document.getElementById('dtUserId').value = dt.userId || '';
      document.getElementById('dtAutoSync').checked = dt.autoSync !== false;
      document.getElementById('dtInterval').value = dt.syncIntervalMin || 10;

      // 钉钉区块默认折叠（记住上次展开状态）
      const dtSection = document.getElementById('dtSection');
      try {
        dtSection.open = localStorage.getItem('dtSectionOpen') === '1';
      } catch (e) {
        dtSection.open = false;
      }
      dtSection.addEventListener('toggle', () => {
        // 因同步失败被自动展开的，不写入记忆，下次仍默认折叠
        if (dtAutoRevealed) {
          dtAutoRevealed = false;
          return;
        }
        try { localStorage.setItem('dtSectionOpen', dtSection.open ? '1' : '0'); } catch (e) {}
      });
      updateDtBadge();

      // 开机自启状态（以系统实际状态为准）
      try {
        const al = await window.api.getAutoLaunch();
        const cb = document.getElementById('autoLaunchInput');
        cb.checked = !!al.enabled;
        if (!al.available) {
          cb.disabled = true;
          document.getElementById('autoLaunchTip').textContent =
            al.reason || '当前环境不可用，打包成 exe 后才生效';
        }
      } catch (e) {
        document.getElementById('autoLaunchInput').disabled = true;
      }

      // 打卡记录
      try {
        todayRecords = await window.api.getRecords();
      } catch (e) {
        todayRecords = { onDuty: null, offDuty: null, source: null };
      }
      renderTodayRecords();
      renderRecent();

      // 更新信息条
      updateInfoBar();
      setInterval(updateInfoBar, 1000);
      startCountdownLoop();

      // 渲染日历
      renderCalendar();

      // 监听打卡记录变化
      window.api.onRecordsUpdated((rec) => {
        todayRecords = rec;
        renderTodayRecords();
        renderRecent();
      });

      // 监听钉钉同步状态
      window.api.onSyncStatus((status) => {
        const el = document.getElementById('syncStatus');
        el.style.display = 'block';
        el.className = 'sync-status ' + (status.ok ? 'ok' : 'err');
        el.textContent = (status.ok ? '✓ ' : '✕ ') + status.text;
        // 失败时把折叠区展开，否则报错信息看不到
        if (!status.ok) revealDtSection();
      });
    }

    // 同步出错时自动展开钉钉区块（不计入折叠记忆）
    let dtAutoRevealed = false;
    function revealDtSection() {
      const s = document.getElementById('dtSection');
      if (!s || s.open) return;
      dtAutoRevealed = true;
      s.open = true;
    }

    // 折叠状态下也能看出钉钉同步的状态
    function updateDtBadge() {
      const badge = document.getElementById('dtBadge');
      if (!badge) return;

      const on = document.getElementById('dtEnabled').checked;
      const filled = ['dtAppKey', 'dtAppSecret', 'dtUserId']
        .every((id) => document.getElementById(id).value.trim());

      let text = '未配置';
      let cls = 'dt-badge';
      if (on && filled) {
        text = '已启用';
        cls = 'dt-badge on';
      } else if (on) {
        text = '配置不完整';
        cls = 'dt-badge warn';
      } else if (filled) {
        text = '已关闭';
      }
      badge.className = cls;
      badge.textContent = text;
    }

    // 更新顶部信息条（显示真实打卡时间）
    function updateInfoBar() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('bigClock').textContent =
        config.showSeconds !== false ? `${h}:${m}:${s}` : `${h}:${m}`;
      document.getElementById('customMsg').textContent = config.customText || '';

      const realIn = todayRecords.onDuty;
      const realOut = todayRecords.offDuty;
      const target = Flex.computeOffDuty(realIn, config);
      const late = realIn ? Flex.isLate(realIn, config) : false;

      const inClass = realIn ? (late ? 'wait' : 'ok') : 'wait';
      const outClass = realOut ? 'ok' : 'wait';

      document.getElementById('checkinStatus').innerHTML =
        `<span class="${inClass}">${realIn ? '✓' : '○'} 上班 ${realIn || '未打卡'}${late ? ' (迟到)' : ''}</span> · ` +
        `<span class="${outClass}">${realOut ? '✓' : '○'} 下班 ${realOut || target}</span>`;

      updateCountdown();
    }

    // 推算下班时间 + 倒计时（精确到毫秒，由 rAF 每帧驱动）
    let lastCdText = null;
    function updateCountdown() {
      const bar = document.getElementById('countdownBar');
      const targetEl = document.getElementById('cdTarget');
      const remainEl = document.getElementById('cdRemain');

      const realIn = todayRecords.onDuty;
      const realOut = todayRecords.offDuty;
      const target = Flex.computeOffDuty(realIn, config);
      if (targetEl.textContent !== target) targetEl.textContent = target;

      let text;
      let done = false;

      if (realOut) {
        done = true;
        text = '已下班 ✓';
      } else {
        const ms = Flex.remainingMilliseconds(realIn, config, new Date());
        if (ms == null) {
          text = '';
        } else if (ms <= 0) {
          done = true;
          text = '可以下班了 🎉';
        } else {
          text = '还有 ' + Flex.formatRemainMs(ms);
        }
      }

      if (text !== lastCdText) {
        remainEl.textContent = text;
        lastCdText = text;
      }
      if (bar.classList.contains('done') !== done) bar.classList.toggle('done', done);
    }

    // 毫秒级刷新循环
    let cdRafId = null;
    function startCountdownLoop() {
      if (cdRafId != null) return;
      const loop = () => {
        updateCountdown();
        cdRafId = requestAnimationFrame(loop);
      };
      cdRafId = requestAnimationFrame(loop);
    }

    // 渲染今日打卡卡片（时间框可直接编辑）
    function renderTodayRecords() {
      const onInput = document.getElementById('onDutyInput');
      const offInput = document.getElementById('offDutyInput');
      const onBadge = document.getElementById('onBadge');
      const offBadge = document.getElementById('offBadge');

      // 正在编辑的输入框不要被刷新覆盖
      if (document.activeElement !== onInput) onInput.value = todayRecords.onDuty || '';
      if (document.activeElement !== offInput) offInput.value = todayRecords.offDuty || '';

      const badge = todayRecords.source === 'dingtalk'
        ? '<span class="badge dingtalk">钉钉</span>'
        : '<span class="badge manual">手动</span>';
      onBadge.innerHTML = todayRecords.onDuty ? badge : '';
      offBadge.innerHTML = todayRecords.offDuty ? badge : '';

      // 已打卡则禁用对应按钮
      document.getElementById('punchOnBtn').disabled = !!todayRecords.onDuty;
      document.getElementById('punchOffBtn').disabled = !!todayRecords.offDuty;

      // 记录一变，顶部信息条（含推算下班时间）和倒计时一起刷新，
      // 不再只靠 setInterval 每秒兜底，避免改完时间后"下班"迟迟不变
      updateInfoBar();
    }

    // 渲染最近 7 天
    async function renderRecent() {
      let list = [];
      try {
        list = await window.api.getRecentRecords(7);
      } catch (e) {
        list = [];
      }
      const wrap = document.getElementById('recentList');
      wrap.innerHTML = '';
      for (const r of list) {
        const row = document.createElement('div');
        row.className = 'recent-row';
        const onTxt = r.onDuty || '<span class="missing">—</span>';
        const offTxt = r.offDuty || '<span class="missing">—</span>';
        row.innerHTML =
          `<span class="date">${r.date.slice(5)}</span>` +
          `<span class="times">上 ${onTxt} · 下 ${offTxt}</span>`;
        wrap.appendChild(row);
      }
    }

    // 打卡按钮
    document.getElementById('punchOnBtn').addEventListener('click', async () => {
      todayRecords = await window.api.recordPunch('onDuty');
      renderTodayRecords();
      renderRecent();
      toast('已记录上班打卡 ' + todayRecords.onDuty);
    });

    document.getElementById('punchOffBtn').addEventListener('click', async () => {
      todayRecords = await window.api.recordPunch('offDuty');
      renderTodayRecords();
      renderRecent();
      toast('已记录下班打卡 ' + todayRecords.offDuty);
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm('确定清除今天的打卡记录？')) return;
      todayRecords = await window.api.clearTodayRecords();
      renderTodayRecords();
      renderRecent();
      toast('已清除今日记录');
    });

    // 开机自启开关
    document.getElementById('autoLaunchInput').addEventListener('change', async (e) => {
      const want = e.target.checked;
      try {
        const r = await window.api.setAutoLaunch(want);
        if (!r.ok) {
          e.target.checked = !want;
          toast(r.message || '设置失败');
          return;
        }
        e.target.checked = !!r.enabled;
        toast(r.enabled ? '已开启开机自启' : '已关闭开机自启');
      } catch (err) {
        e.target.checked = !want;
        toast('设置失败：' + (err.message || err));
      }
    });

    // 手动编辑打卡时间
    // time 输入框在键盘改数字 / 点选时分针时，往往只派发 input，change 要失焦才触发。
    // 只监听 change 就会出现"输入框显示已改，但记录没保存、推算下班时间不动"。
    // 这里 input + change 都监听：input 防抖兜底，change 立即生效。
    function bindTimeInput(id, type, label) {
      const el = document.getElementById(id);
      let timer = null;

      const apply = async () => {
        const value = el.value;
        // 与当前记录一致就不写盘，省掉无意义的 IPC
        if (value === (todayRecords[type] || '')) return;
        todayRecords = await window.api.setRecordTime(type, value);
        renderTodayRecords();
        renderRecent();
        toast(value ? `${label}时间已改为 ${value}` : `已清除${label}时间`);
      };

      el.addEventListener('input', () => {
        // 逐位输入过程中 value 可能短暂为空，此时别把记录清掉
        if (!el.value) return;
        clearTimeout(timer);
        timer = setTimeout(apply, 500);
      });

      el.addEventListener('change', () => {
        clearTimeout(timer);
        apply();
      });
    }

    bindTimeInput('onDutyInput', 'onDuty', '上班');
    bindTimeInput('offDutyInput', 'offDuty', '下班');

    // 弹性工作制：切换显示 + 实时推算下班窗口
    function toggleFlexFields() {
      const enabled = document.getElementById('flexEnabled').checked;
      document.getElementById('flexFields').style.display = enabled ? '' : 'none';
      document.getElementById('fixedFields').style.display = enabled ? 'none' : '';
    }

    function updateFlexOffWindow() {
      const begin = document.getElementById('flexStartBegin').value || '08:30';
      const end = document.getElementById('flexStartEnd').value || '09:00';
      const hours = parseFloat(document.getElementById('flexWorkHours').value) || 9.5;
      const mins = Math.round(hours * 60);
      const from = Flex.toHHmm(Flex.toMin(begin) + mins);
      const to = Flex.toHHmm(Flex.toMin(end) + mins);
      document.getElementById('flexOffWindow').textContent = `${from} — ${to}`;
    }

    // 弹性设置改完自动保存：用户直觉是"改了就生效"，
    // 而打卡时间是即时保存的，两处行为不一致会让人以为改了没用（实测踩过）。
    let flexSaveTimer = null;
    function scheduleFlexSave() {
      clearTimeout(flexSaveTimer);
      flexSaveTimer = setTimeout(async () => {
        const flex = {
          enabled: document.getElementById('flexEnabled').checked,
          startBegin: document.getElementById('flexStartBegin').value || '08:30',
          startEnd: document.getElementById('flexStartEnd').value || '09:00',
          workMinutes: Math.round((parseFloat(document.getElementById('flexWorkHours').value) || 9.5) * 60),
        };
        // main.js 的 config:save 是深合并，只传 flex 不会冲掉其它设置
        config = await window.api.saveConfig({ flex });
        updateInfoBar(); // 推算下班时间 / 倒计时立即按新弹性重算
      }, 600);
    }

    document.getElementById('flexEnabled').addEventListener('change', () => {
      toggleFlexFields();
      scheduleFlexSave();
    });
    ['flexStartBegin', 'flexStartEnd', 'flexWorkHours'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => {
        updateFlexOffWindow();
        scheduleFlexSave();
      });
    });

    // 钉钉配置项变动时同步更新折叠标题上的状态徽标
    ['dtEnabled', 'dtAppKey', 'dtAppSecret', 'dtUserId'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('input', updateDtBadge);
      el.addEventListener('change', updateDtBadge);
    });

    // 立即同步钉钉
    document.getElementById('syncNowBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncNowBtn');
      btn.disabled = true;
      btn.textContent = '同步中...';
      try {
        const res = await window.api.syncDingtalk();
        if (!res.ok) {
          const el = document.getElementById('syncStatus');
          el.style.display = 'block';
          el.className = 'sync-status err';
          el.textContent = '✕ ' + (res.error || '同步失败');
          revealDtSection();
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '立即同步今天';
      }
    });

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg + ' ✓';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    // 渲染日历
    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      document.getElementById('monthLabel').textContent = `${year}年 ${monthNames[month]}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      // 星期标题
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(w => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = w;
        grid.appendChild(el);
      });

      // 获取当月第一天
      const firstDay = new Date(year, month, 1);
      const firstDayOfWeek = firstDay.getDay();

      // 上个月的尾部
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = firstDayOfWeek - 1; i >= 0; i--) {
        const el = createDayCell(prevMonthLastDay - i, true);
        grid.appendChild(el);
      }

      // 当月
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === today.getDate() &&
          month === today.getMonth() &&
          year === today.getFullYear();
        const el = createDayCell(d, false, isToday);
        grid.appendChild(el);
      }

      // 下个月开头（补满 6 行 = 42 格）
      const totalCells = grid.children.length - 7; // 减去星期标题
      const remaining = 42 - totalCells;
      for (let d = 1; d <= remaining; d++) {
        const el = createDayCell(d, true);
        grid.appendChild(el);
      }
    }

    function createDayCell(day, otherMonth, isToday) {
      const el = document.createElement('div');
      el.className = 'day';
      if (otherMonth) el.classList.add('other-month');
      if (isToday) el.classList.add('today');
      el.textContent = day;
      return el;
    }

    // 月份切换
    document.getElementById('prevMonth').addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    });

    // 透明度滑块实时显示
    document.getElementById('opacityInput').addEventListener('input', (e) => {
      document.getElementById('opacityValue').textContent = Math.round(e.target.value * 100) + '%';
    });

    // 保存设置
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const flexEnabled = document.getElementById('flexEnabled').checked;
      const startBegin = document.getElementById('flexStartBegin').value || '08:30';
      const startEnd = document.getElementById('flexStartEnd').value || '09:00';
      const workMinutes = Math.round(
        (parseFloat(document.getElementById('flexWorkHours').value) || 9.5) * 60
      );
      const offFrom = Flex.toHHmm(Flex.toMin(startBegin) + workMinutes);

      const newConfig = {
        customText: document.getElementById('customTextInput').value,
        // 弹性模式：最晚上班 = 弹性结束；最早下班 = 弹性开始 + 工作时长
        checkInTime: flexEnabled ? startEnd : (document.getElementById('checkInInput').value || '09:00'),
        checkOutTime: flexEnabled ? offFrom : (document.getElementById('checkOutInput').value || '18:00'),
        flex: { enabled: flexEnabled, startBegin, startEnd, workMinutes },
        bgColor: document.getElementById('bgColorInput').value,
        textColor: document.getElementById('textColorInput').value,
        accentColor: document.getElementById('accentColorInput').value,
        opacity: parseFloat(document.getElementById('opacityInput').value),
        showSeconds: document.getElementById('showSecondsInput').checked,
        showDate: document.getElementById('showDateInput').checked,
        dingtalk: {
          enabled: document.getElementById('dtEnabled').checked,
          appKey: document.getElementById('dtAppKey').value.trim(),
          appSecret: document.getElementById('dtAppSecret').value.trim(),
          userId: document.getElementById('dtUserId').value.trim(),
          autoSync: document.getElementById('dtAutoSync').checked,
          syncIntervalMin: Number(document.getElementById('dtInterval').value) || 10,
        },
      };

      config = await window.api.saveConfig(newConfig);
      updateInfoBar();
      updateDtBadge();

      // 显示 toast
      const toast = document.getElementById('toast');
      toast.textContent = '已保存 ✓';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    });

    init();
  </script>
</body>
</html>
